name: threepio_core
description: Production-ready LLM application framework for Dart/Flutter. Build intelligent apps with chat models, RAG, agents, graphs, and observability. Inspired by Eino and LangChain.
version: 0.1.0
homepage: https://github.com/EsotericTech/threepio
repository: https://github.com/EsotericTech/threepio
issue_tracker: https://github.com/EsotericTech/threepio/issues
documentation: https://github.com/EsotericTech/threepio/blob/main/README.md

environment:
  # The code generators this package is built with (freezed, json_serializable)
  # need Dart 3.9, so nothing older can build or test it.
  sdk: ^3.9.0

dependencies:
  # Core
  meta: ^1.9.0

  # JSON & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.0

  # Utilities
  collection: ^1.18.0
  logging: ^1.2.0
  uuid: ^4.2.0

  # Templates (Jinja2 for `FormatType.jinja2`)
  jinja: ^0.6.0

  # HTTP Client
  http: ^1.1.0

dev_dependencies:
  # Testing
  test: ^1.24.0

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^3.2.3
  json_serializable: ^6.7.0

  # Linting
  very_good_analysis: ^5.1.0
